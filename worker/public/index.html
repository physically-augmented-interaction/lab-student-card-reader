<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>入退室ダッシュボード</title>
  <link rel="stylesheet" href="/admin.css" />
</head>
<body>
  <header>
    <div>
      <p class="kicker">Manabe Lab</p>
      <h1>入退室ダッシュボード</h1>
    </div>
    <div class="header-actions">
      <nav>
        <a class="active" href="/">ダッシュボード</a>
        <a href="/settings/">設定</a>
      </nav>
      <label class="month">
        対象月
        <input id="month" type="month" />
      </label>
    </div>
  </header>

  <p id="error" class="notice"></p>
  <section class="cards" id="summary"></section>

  <section>
    <h2>月次来室</h2>
    <div class="chart" id="chart"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>学籍番号</th><th>名前</th><th>入室</th><th>退室</th><th>最終</th></tr>
        </thead>
        <tbody id="member-stats"></tbody>
      </table>
    </div>
  </section>

  <script src="/common.js"></script>
  <script src="/dashboard.js"></script>
</body>
</html>
