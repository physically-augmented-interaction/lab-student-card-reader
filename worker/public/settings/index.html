<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>入退室設定</title>
  <link rel="stylesheet" href="/admin.css" />
</head>
<body>
  <header>
    <div>
      <p class="kicker">Manabe Lab</p>
      <h1>設定</h1>
    </div>
    <nav>
      <a href="/">ダッシュボード</a>
      <a class="active" href="/settings/">設定</a>
    </nav>
  </header>

  <section>
    <div class="section-head">
      <h2>メンバー追加 / 更新</h2>
    </div>
    <p id="member-notice" class="notice"></p>
    <form id="member-form">
      <div class="form-grid">
        <label class="field"><span>学籍番号</span><input name="studentId" placeholder="AE19051" required /></label>
        <label class="field"><span>名前</span><input name="displayName" placeholder="表示名" /></label>
        <label class="field"><span>メモ</span><input name="note" placeholder="任意" /></label>
      </div>
      <div class="sound-grid">
        <label class="file-box"><span>入室音</span><input name="enterSound" type="file" accept="audio/*" /></label>
        <label class="file-box"><span>退室音</span><input name="leaveSound" type="file" accept="audio/*" /></label>
      </div>
      <div class="actions">
        <button type="submit">保存</button>
      </div>
    </form>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>学籍番号</th><th>名前</th><th>メモ</th><th>入室音</th><th>退室音</th></tr>
        </thead>
        <tbody id="members"></tbody>
      </table>
    </div>
  </section>

  <section>
    <div class="section-head">
      <h2>デフォルト効果音</h2>
    </div>
    <p id="default-status" class="notice"></p>
    <form id="default-form">
      <div class="sound-grid">
        <label class="file-box"><span>入室デフォルト</span><input name="enterSound" type="file" accept="audio/*" /></label>
        <label class="file-box"><span>退室デフォルト</span><input name="leaveSound" type="file" accept="audio/*" /></label>
      </div>
      <div class="actions">
        <button type="submit">保存</button>
      </div>
    </form>
  </section>

  <section>
    <div class="section-head">
      <h2>API キー</h2>
    </div>
    <form id="key-form" class="key-row">
      <label class="field"><span>リーダー名</span><input name="name" placeholder="tablet-1" value="tablet-1" /></label>
      <button type="submit">発行</button>
    </form>
    <p id="new-key" class="notice"></p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>名前</th><th>prefix</th><th>最終利用</th><th></th></tr>
        </thead>
        <tbody id="api-keys"></tbody>
      </table>
    </div>
  </section>

  <script src="/common.js"></script>
  <script src="/settings.js"></script>
</body>
</html>
