name: Release APK

on:
  push:
    tags:
      - "release/v*"

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse release version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#release/v}"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "Tag must look like release/v1.2.3, got $TAG" >&2
            exit 1
          fi
          export VERSION
          CODE=$(python3 - <<'PY'
          import os
          parts = [int(p) for p in os.environ["VERSION"].split(".")] + [0, 0, 0]
          major, minor, patch = parts[:3]
          print(major * 10000 + minor * 100 + patch)
          PY
          )
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: bash scripts/install-android-sdk.sh

      - name: Install JS dependencies
        working-directory: app
        run: npm ci

      - name: Assemble release APK
        working-directory: app/android
        env:
          LAB_VERSION_NAME: ${{ steps.version.outputs.name }}
          LAB_VERSION_CODE: ${{ steps.version.outputs.code }}
          LAB_API_BASE_URL: https://lab-attendance.manabe-lab.workers.dev
          LAB_DEVICE_ID: tablet-1
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/android/app/build/outputs/apk/release/app-release.apk \
            "dist/lab-student-card-reader-${{ steps.version.outputs.name }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: dist/lab-student-card-reader-${{ steps.version.outputs.name }}.apk
          fail_on_unmatched_files: true
